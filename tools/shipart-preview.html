<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ship art preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #06080c; color: #b9c3d1; font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #1c2430; position: sticky; top: 0; background: #06080cee; }
  header label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  header input[type=range] { width: 90px; }
  select, button { background: #0f151d; color: inherit; border: 1px solid #2a3542; padding: 3px 6px; }
  main { padding: 12px 16px 40px; }
  .ship { margin: 0 0 28px; }
  .ship h2 { font-size: 15px; font-weight: 600; margin: 0 0 2px; color: #e6edf5; }
  .ship p { margin: 0 0 8px; color: #7f8b9a; }
  .views { display: flex; flex-wrap: wrap; gap: 12px; }
  .view { background: radial-gradient(ellipse at 40% 35%, #0e1420 0%, #05070a 70%); border: 1px solid #1c2430; position: relative; }
  .view span { position: absolute; left: 6px; top: 4px; font-size: 11px; color: #5d6a7a; letter-spacing: 0.04em; text-transform: uppercase; }
  canvas { display: block; }
  .missing { color: #ff8a5b; }
</style>
</head>
<body>
<header>
  <strong>Ship art</strong>
  <label>Faction <select id="faction"><option>JC</option><option>ISA</option><option>CIV</option></select></label>
  <label>Radiators <input id="radiators" type="range" min="0" max="1" step="0.05" value="1"></label>
  <label>Throttle <input id="throttle" type="range" min="0" max="1" step="0.05" value="0"></label>
  <label>Heat <input id="heat" type="range" min="0" max="1" step="0.05" value="0.2"></label>
  <label>Hull <input id="hull" type="range" min="0" max="1" step="0.05" value="1"></label>
  <label>Nose wear <input id="dnose" type="range" min="0" max="1" step="0.05" value="0"></label>
  <label>Flank wear <input id="dflank" type="range" min="0" max="1" step="0.05" value="0"></label>
  <label>Tail wear <input id="dtail" type="range" min="0" max="1" step="0.05" value="0"></label>
  <label>Light az <input id="laz" type="range" min="-180" max="180" step="5" value="-50"></label>
  <label>Light el <input id="lel" type="range" min="-90" max="90" step="5" value="35"></label>
  <label>Size <input id="size" type="range" min="40" max="900" step="10" value="360"></label>
  <label><input id="disabled" type="checkbox"> Disabled</label>
  <label><input id="destroyed" type="checkbox"> Destroyed</label>
  <label><input id="spin" type="checkbox"> Orbit camera</label>
  <button id="redraw">Redraw</button>
</header>
<main id="main"></main>
<script>window.OD = window.OD || {};</script>
<script src="../js/ships.js"></script>
<script src="../js/shipart.js"></script>
<script>
  // Design sources: appended into js/shipart.js for the game; loaded separately here so each can be edited alone.
  // If a design is already registered (built shipart.js), its source file is skipped.
  (function () {
    const ids = ['corvette', 'frigate', 'destroyer', 'cruiser', 'lancer', 'freighter', 'station'];
    const params = new URLSearchParams(location.search);
    const only = params.get('only');
    const pending = [];
    for (const id of ids) {
      if (only && id !== only) continue;
      if (OD.ShipArt.has(id)) continue;
      pending.push(new Promise((res) => { const s = document.createElement('script'); s.src = '../assets/ships/src/' + id + '.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); }));
    }
    window.ShipPreview = { ready: Promise.all(pending), ids: only ? [only] : ids };
  })();
</script>
<script>
  const $ = (id) => document.getElementById(id);
  const VIEWS = ['side', 'threequarter', 'top', 'dorsal34', 'front', 'rear'];
  function readState() {
    return {
      faction: $('faction').value,
      size: +$('size').value,
      light: { az: +$('laz').value, el: +$('lel').value },
      state: {
        radiators: +$('radiators').value, throttle: +$('throttle').value, heat: +$('heat').value, hull: +$('hull').value,
        damage: { nose: +$('dnose').value, flank: +$('dflank').value, tail: +$('dtail').value },
        disabled: $('disabled').checked, destroyed: $('destroyed').checked,
      },
    };
  }
  let t0 = performance.now(), spinning = false;
  function buildPage() {
    const main = $('main'); main.innerHTML = '';
    for (const id of window.ShipPreview.ids) {
      const sec = document.createElement('section'); sec.className = 'ship'; sec.dataset.id = id;
      const d = OD.ShipArt.describe(id);
      const cls = OD.Ships.CLASSES[id];
      sec.innerHTML = '<h2>' + (d ? d.name : id) + (d ? ' · ' + d.length + ' m' : ' <span class="missing">(not registered)</span>') + '</h2><p>' + (d ? d.blurb : (cls ? cls.blurb : '')) + '</p><div class="views"></div>';
      main.appendChild(sec);
      if (!d) continue;
      const views = sec.querySelector('.views');
      for (const v of VIEWS) {
        const box = document.createElement('div'); box.className = 'view'; box.dataset.view = v;
        const c = document.createElement('canvas'); c.dataset.id = id; c.dataset.view = v;
        box.appendChild(c); const lab = document.createElement('span'); lab.textContent = v; box.appendChild(lab);
        views.appendChild(box);
      }
    }
  }
  function drawAll() {
    const o = readState();
    const t = (performance.now() - t0) / 1000;
    for (const c of document.querySelectorAll('canvas[data-id]')) {
      const id = c.dataset.id, vname = c.dataset.view;
      const view = spinning ? { az: OD.ShipArt.VIEWS[vname].az + t * 20, el: OD.ShipArt.VIEWS[vname].el } : vname;
      const size = vname === 'front' || vname === 'rear' ? o.size * 0.6 : o.size;
      const b = OD.ShipArt.bounds(id, Object.assign({}, o, { view, size }));
      const pad = 12 + Math.round(size * 0.12);
      const W = Math.max(b.w + pad * 2, size * (vname === 'front' || vname === 'rear' ? 0.5 : 0.35)), H = Math.max(b.h + pad * 2, 90);
      const plumeSpace = o.state.throttle > 0 && (vname === 'side' || vname === 'top' || vname === 'threequarter' || vname === 'dorsal34') ? size * 1.2 : 0;
      const cw = Math.ceil(W + plumeSpace), ch = Math.ceil(H);
      if (c.width !== cw || c.height !== ch) { c.width = cw; c.height = ch; }
      const ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height);
      OD.ShipArt.draw(ctx, id, Object.assign({}, o, { view, size, x: pad + b.ox + (vname === 'rear' ? 0 : 0), y: pad + b.oy, time: t, rotation: 0 }));
    }
  }
  function loop() { if (spinning || +$('throttle').value > 0) drawAll(); requestAnimationFrame(loop); }
  window.ShipPreview.ready.then(() => {
    buildPage(); drawAll();
    document.querySelectorAll('header input, header select').forEach((el) => el.addEventListener('input', drawAll));
    $('redraw').addEventListener('click', () => { OD.ShipArt.clearCache(); drawAll(); });
    $('spin').addEventListener('change', (e) => { spinning = e.target.checked; });
    requestAnimationFrame(loop);
    window.ShipPreview.loaded = true;
  });
  // headless helper: render one view to a fresh canvas and return a data URL
  window.ShipPreview.shot = function (id, view, size, opts) {
    opts = Object.assign({ faction: 'JC', state: {}, light: { az: -50, el: 35 } }, opts || {});
    const b = OD.ShipArt.bounds(id, Object.assign({}, opts, { view, size, cache: false }));
    const thr = (opts.state && opts.state.throttle) || 0;
    const pad = 16 + Math.round(size * 0.06);
    const tailLeft = view !== 'front' && view !== 'rear';
    const extra = thr > 0 && tailLeft ? size * (0.6 + 1.6 * thr) : 0;
    const c = document.createElement('canvas');
    c.width = Math.ceil(b.w + pad * 2 + extra); c.height = Math.ceil(b.h + pad * 2);
    const ctx = c.getContext('2d');
    if (opts.background !== false) {
      const g = ctx.createRadialGradient(c.width * 0.4, c.height * 0.35, 10, c.width * 0.5, c.height * 0.5, Math.max(c.width, c.height) * 0.8);
      g.addColorStop(0, '#0e1420'); g.addColorStop(1, '#04060a'); ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
      // a few stars
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 0; i < 60; i++) { const x = ((i * 7919) % 1000) / 1000 * c.width, y = ((i * 104729) % 1000) / 1000 * c.height; ctx.fillRect(x, y, 1, 1); }
    }
    OD.ShipArt.draw(ctx, id, Object.assign({}, opts, { view, size, x: pad + b.ox + extra, y: pad + b.oy, cache: false, time: opts.time || 1.3 }));
    return c.toDataURL('image/png');
  };
</script>
</body>
</html>
